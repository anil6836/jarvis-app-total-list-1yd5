plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'com.jarvis.apps.totallist1yd5'
    compileSdk 34

    defaultConfig {
        applicationId 'com.jarvis.apps.totallist1yd5'
        minSdk 24
        targetSdk 34
        versionCode runNumber
        versionName "1.${runNumber}"
    }

    signingConfigs {
        jarvis {
            storeFile file('jarvis-apps.keystore')
            storePassword 'jarvisapps'
            keyAlias 'jarvisapps'
            keyPassword 'jarvisapps'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.jarvis
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
